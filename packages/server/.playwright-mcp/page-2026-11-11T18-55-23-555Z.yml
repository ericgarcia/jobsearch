        - heading "Backend Engineer, Core Technology" [level=1] [ref=f2e50]
      - generic [ref=f2e53]:
        - generic [ref=f2e54]:
          - generic [ref=f2e55]:
            - heading "Who we are" [level=2] [ref=f2e56]
            - article [ref=f2e58]:
              - heading "About Stripe" [level=3] [ref=f2e59]
              - paragraph [ref=f2e60]: Stripe is a financial infrastructure platform for businesses. Millions of companies—from the world's largest enterprises to the most ambitious startups—use Stripe to accept payments, grow their revenue, and accelerate new business opportunities. Our mission is to increase the GDP of the internet, and we have a staggering amount of work ahead. That means you have an unprecedented opportunity to put the global economy within everyone's reach while doing the most important work of your career.
              - heading "About the team" [level=3] [ref=f2e61]
              - paragraph [ref=f2e62]: Stripe Infrastructure is responsible for the reliability, scale, performance, and cost of Stripe's systems and the productivity and sentiment of Stripe's people.
              - paragraph [ref=f2e63]: "You may work on a wide variety of critical business areas including:"
              - list [ref=f2e64]:
                - listitem [ref=f2e65]: Core Infrastructure—We're the home for Stripe's critical tier0 infrastructure systems (Compute, Networking, DocumentDB, Distributed Caching and High assurance engineering). We build the foundational platform for Stripe products and services to allow them to operate at scale. We drive reliability, availability, efficiency, and scalability of these systems.
                - listitem [ref=f2e66]: Developer Infrastructure—We're responsible for the productivity of all developers at Stripe. Ensure Stripe's engineers have a reliable, fast, and easy-to-use inner dev loop to maximize productivity while building everything from low-latency microservices to large-scale data pipelines and machine learning models.
                - listitem [ref=f2e67]: Data Infrastructure—We're responsible for offering data serving infrastructure spanning across data warehouse analytics, streaming analytics, and search capabilities. The stack is supported by a collection of internally developed large-scale distributed services and several popular open-source technologies like Trino/Presto, Apache Pinot, Hive Metastore, ElasticSearch etc. The systems we own support all of the data serving needs of high-scale services and thousands of individual Stripes across the company.
                - listitem [ref=f2e68]: Admin Platform—We empower Stripes to quickly build secure and delightful internal products in service of their users.
                - listitem [ref=f2e69]: Service Platform—We enable engineering teams at Stripe to easily write and ship useful services that correctly, reliably, and efficiently leverage platform capabilities.
                - listitem [ref=f2e70]: Developer Productivity AI—We're responsible for doubling Stripe's engineering velocity through effective use of LLMs. We own Minions, Stripe's one-shot, end-to-end coding agents.
              - paragraph [ref=f2e71]:
                - text: Team matching—exact team matching for one of the subteams will begin during final stages. Please note we may also consider you for different orgs based on your experience, location, etc. Find more information on our team matching process
                - link "here" [ref=f2e72] [cursor=pointer]:
                  - /url: https://docs.google.com/document/d/1zvJkO2c7GzukHG-_oqc5wbOLajpuh5FjbmZPcZPU1o0/edit?tab=t.0#heading=h.x8j6mm75yuwr
                - text: .
          - generic [ref=f2e73]:
            - heading "What you'll do" [level=2] [ref=f2e74]
            - article [ref=f2e76]:
              - paragraph [ref=f2e77]: You'll work on projects that span technologies, systems, and processes where you'll design, build, test, and ship great code every day.
              - heading "Responsibilities" [level=3] [ref=f2e78]
              - list [ref=f2e79]:
                - listitem [ref=f2e80]: Build a great customer experience for internal and external Stripe teams using our infrastructure
                - listitem [ref=f2e81]: Participate in roadmap planning and prioritization
                - listitem [ref=f2e82]: Deliver value through a strong collaborative approach with multiple customers and stakeholders across Stripe
                - listitem [ref=f2e83]: Debug production issues across services and several levels of the stack
          - generic [ref=f2e84]:
            - heading "Who you are" [level=2] [ref=f2e85]
            - article [ref=f2e87]:
              - paragraph [ref=f2e88]: We're looking for someone who meets the minimum requirements to be considered for the role. If you meet these requirements, you are encouraged to apply. The preferred qualifications are a bonus, not a requirement.
              - heading "Minimum requirements" [level=3] [ref=f2e89]
              - list [ref=f2e90]:
                - listitem [ref=f2e91]: Strong software engineering skills and a passion for one of the areas above
                - listitem [ref=f2e92]: Ability to write high-quality code (in programming languages like Go, Java, C/C++ etc.)
                - listitem [ref=f2e93]: 2–12+ years of professional hands-on software development experience, able to write well-factored algorithms and have experience with commonly used data structures and algorithms
                - listitem [ref=f2e94]: Hands-on experience contributing to or building large-scale distributed systems
                - listitem [ref=f2e95]: Strong collaboration skills, can work across workstreams within your team and contribute to your peers' success
                - listitem [ref=f2e96]: Customer obsession, ability to articulate and represent customer experience in various forums to drive the right outcome
                - listitem [ref=f2e97]: Have the ability to thrive on a high level of autonomy and responsibility, and think of yourself as entrepreneurial
              - heading "Preferred qualifications" [level=3] [ref=f2e98]
              - list [ref=f2e99]:
                - listitem [ref=f2e100]: Experience optimizing the end-to-end performance of distributed systems
                - listitem [ref=f2e101]: Focus on the needs of our users, both internal and external
                - listitem [ref=f2e102]: Hold yourself and others to a high bar when working with production
          - generic [ref=f2e103]:
            - heading "Hybrid work at Stripe" [level=2] [ref=f2e104]
            - article [ref=f2e106]:
              - paragraph [ref=f2e107]: This role is available either in an office or a remote location (35+ miles or 56+ km from a Stripe office).
              - heading "In-office expectations" [level=3] [ref=f2e108]
              - paragraph [ref=f2e109]: Office-assigned Stripes spend at least 50% of the time in a given month in their local office or with users. This hits a balance between bringing people together for in-person collaboration and learning from each other, while supporting flexibility about how to do this in a way that makes sense for individuals and their teams.
              - heading "Working remotely at Stripe" [level=3] [ref=f2e110]
              - paragraph [ref=f2e111]: A remote location is defined as being 35 miles (56 kilometers) or more from one of our offices. While you would be welcome to come into the office for team/business meetings, on-sites, meet-ups, and events, our expectation is you would regularly work from home rather than a Stripe office. Stripe does not cover the cost of relocating to a remote location. We encourage you to apply for roles that match the location where you currently live or plan to live.
          - generic [ref=f2e112]:
            - heading "Pay and benefits" [level=2] [ref=f2e113]
            - generic [ref=f2e114]:
              - paragraph [ref=f2e115]: The annual US base salary range for this role is $142,600 - $259,600. For sales roles, the range provided is the role’s On Target Earnings ("OTE") range, meaning that the range includes both the sales commissions/sales bonuses target and annual base salary for the role. This salary range may be inclusive of several career levels at Stripe and will be narrowed during the interview process based on a number of factors, including the candidate’s experience, qualifications, and location. Applicants interested in this role and who are not located in the US may request the annual salary range for their location during the interview process.
              - paragraph [ref=f2e116]: "Additional benefits for this role may include: equity, company bonus or sales commissions/bonuses; 401(k) plan; medical, dental, and vision benefits; and wellness stipends."
          - generic [ref=f2e117]:
            - heading "We look forward to hearing from you." [level=2] [ref=f2e118]
            - paragraph [ref=f2e119]: At Stripe, we're looking for people with passion, grit, and integrity. You're encouraged to apply even if your experience doesn't precisely match the job description. Your skills and passion will stand out—and set you apart—especially if your career has taken some extraordinary twists and turns. At Stripe, we welcome diverse perspectives and people who think rigorously and aren't afraid to challenge assumptions. Join us.
            - link [ref=f2e120] [cursor=pointer]:
              - /url: /careers/apply/backend-engineer-core-technology/6042172
              - text: Apply now
              - generic [ref=f2e121]: ⁠
          - generic [ref=f2e128]:
            - paragraph [ref=f2e129]:
              - text: Please find our California applicant personal information notice
              - link "here" [ref=f2e130] [cursor=pointer]:
                - /url: /legal/california-applicant-notice
              - text: .
            - paragraph [ref=f2e131]: The application window will remain open for 100 days after the Job Post is published. However, this opportunity will remain open based on the needs of the business, which may cause the application window to close before or after the 100-day mark.
