      - generic [ref=f5e29]:
        - paragraph [ref=f5e30]: The Personalization team makes deciding what to play next easier and more enjoyable for every listener. From Blend to Discover Weekly, we’re behind some of Spotify’s most-loved features. We built them by understanding the world of music and podcasts better than anyone else. Join us and you’ll keep millions of users listening by making great recommendations to each and every one of them.
        - paragraph [ref=f5e31]: At Spotify, great personalization is about more than recommending the right song. It's about creating listening experiences that feel effortless and meaningful while balancing the needs of listeners, creators, and our business. The Samba team, part of Spotify's Personalization Mission, works on multi-objective balancing and sequencing for personalized listening experiences like Autoplay, Radio, and Mixes. Our engineers bring together machine learning, backend engineering, and data engineering to build systems that support Spotify's financial objectives while keeping listeners at the center of what we do.
        - paragraph [ref=f5e32]: We're looking for an Engineering Manager to lead this team, develop our engineers, and help shape the technical direction of systems that influence how millions of people experience Spotify.
      - generic [ref=f5e34]:
        - heading "What You'll Do" [level=3] [ref=f5e35]
        - list [ref=f5e38]:
          - listitem [ref=f5e39]: Lead and grow a team of machine learning, backend, and data engineers, supporting their development and helping them deliver their best work.Shape the team's technical strategy and execution, ensuring engineering efforts align with listener needs and Spotify's broader business goals.
          - listitem [ref=f5e40]: Guide the development of machine learning and recommendation systems that balance multiple objectives across personalized listening experiences.
          - listitem [ref=f5e41]: Collaborate with Product and engineering partners to define priorities, align on outcomes, and translate complex challenges into clear plans.
          - listitem [ref=f5e42]: Support the team in making thoughtful technical decisions across experimentation, scalability, system reliability, and model performance.
          - listitem [ref=f5e43]: Create a culture of ownership, collaboration, and continuous improvement, where engineers feel empowered to experiment and learn.
          - listitem [ref=f5e44]: Drive effective planning and delivery while balancing immediate priorities with long-term technical health.
          - listitem [ref=f5e45]: Foster an inclusive, supportive team environment through coaching, feedback, and thoughtful people leadership.
      - generic [ref=f5e47]:
        - heading "Who You Are" [level=3] [ref=f5e48]
        - list [ref=f5e52]:
          - listitem [ref=f5e53]: You have experience managing and developing engineering teams, with a track record of helping people grow and delivering impactful results.
          - listitem [ref=f5e54]: You bring a strong technical background in machine learning, software engineering, or related areas, and can confidently guide technical conversations.
          - listitem [ref=f5e55]: You understand the opportunities and challenges of developing and operating machine learning systems in production.
          - listitem [ref=f5e56]: You have experience working with cross-functional partners to define priorities, navigate trade-offs, and deliver against shared goals.
          - listitem [ref=f5e57]: You are comfortable leading teams through ambiguity and helping engineers make informed technical decisions.
          - listitem [ref=f5e58]: You care about building inclusive, collaborative environments where people feel supported and empowered.
          - listitem [ref=f5e59]: You communicate with clarity, lead with empathy, and know how to balance people, technology, and business needs
      - generic [ref=f5e61]:
