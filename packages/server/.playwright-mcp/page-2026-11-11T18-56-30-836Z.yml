        - list [ref=f5e65]:
          - listitem [ref=f5e66]: We offer you the flexibility to work where you work best! For this role, you can be within the North Americas region as long as we have a work location.
          - listitem [ref=f5e67]: This team operates within the Eastern Standard time zone for collaboration.
      - generic [ref=f5e68]:
        - generic [ref=f5e69]: The United States base range for this position is $227,495- $262,928 plus equity. The benefits available for this position include health insurance, six month paid parental leave, 401(k) retirement plan, monthly meal allowance, 23 paid days off, 13 paid flexible holidays, paid sick leave. These ranges may be modified in the future.
        - generic [ref=f5e71]: Spotify is an equal opportunity employer. You are welcome at Spotify for who you are, no matter where you come from, what you look like, or what’s playing in your headphones. Our platform is for everyone, and so is our workplace. The more voices we have represented and amplified in our business, the more we will all thrive, contribute, and be forward-thinking! So bring us your personal experience, your perspectives, and your background. It’s in our differences that we will find the power to keep revolutionizing the way the world listens.
        - generic [ref=f5e73]: At Spotify, we are passionate about inclusivity and making sure our entire recruitment process is accessible to everyone. We have ways to request reasonable accommodations during the interview process and help assist in what you need. If you need accommodations at any stage of the application or interview process, please let us know - we’re here to support you in any way we can.
